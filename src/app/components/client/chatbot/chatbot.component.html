<div class="chatbot-container" [class.open]="isOpen">
    <!-- Chat Button -->
    <div class="chat-button" (click)="toggleChat()">
        <i class="fas fa-comments"></i>
        <span class="notification-badge" *ngIf="unreadCount > 0">{{unreadCount}}</span>
    </div>

    <!-- Chat Window -->
    <div class="chat-window" *ngIf="isOpen">
        <!-- Chat Header -->
        <div class="chat-header">
            <div class="chat-header-info">
                <h3>Hỗ trợ khách hàng AI</h3>
                <p>Bot sẽ trả lời ngay lập tức</p>
            </div>
            <button class="close-button" (click)="toggleChat()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Chat Messages -->
        <div class="chat-messages" #scrollMe>
            <div *ngFor="let message of messages" 
                 [ngClass]="{'message': true, 'user': message.isUser, 'bot': !message.isUser}">
                <div class="message-content">
                    <div class="message-avatar" *ngIf="!message.isUser">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="message-bubble">
                        <ng-container *ngIf="!message.typing; else typingIndicator">
                            <div class="message-text">{{message.text}}</div>
                            <div class="message-time">{{message.time | date:'shortTime'}}</div>
                        </ng-container>
                        <ng-template #typingIndicator>
                            <div class="typing-indicator">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                        </ng-template>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Input -->
        <div class="chat-input">
            <input 
                type="text" 
                [(ngModel)]="userInput" 
                (keyup.enter)="sendMessage()"
                placeholder="Nhập tin nhắn của bạn..."
                [disabled]="isTyping">
            <button (click)="sendMessage()" [disabled]="!userInput.trim() || isTyping">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>
